services:
  postgres:
    image: postgres:16-alpine
    container_name: arigatours-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-arigatours}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-arigatours_secret}
      POSTGRES_DB: ${POSTGRES_DB:-arigatours_db}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-arigatours} -d ${POSTGRES_DB:-arigatours_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
